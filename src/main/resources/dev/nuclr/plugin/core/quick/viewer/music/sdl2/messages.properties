# English texts of the SDL2 music quick viewer plugin, read through Messages.tr(...).
# Translations: messages_<language>.properties with the same keys; a missing key falls back to this file.
# A text used with arguments ({0}, {1}...) is a MessageFormat pattern: write a literal apostrophe as ''.
# A text used without arguments is shown exactly as written.
# The text drawn inside the retro visualizers (scrollers, fake DOS/BBS/C64 screens, game HUDs) is
# part of each tribute and stays English; so do visualizer names that are titles or system names.

